<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicare Assignment of Benefit — Wisdom Surgery Clinic</title>
  <meta name="robots" content="noindex">
  <!--
    Redirect stub. The Medicare AOB lives only in the Team portal repo now.

    This copy carried its own, older PDF exporter: it sliced the page at fixed
    intervals while drawing at an offset, so every page break repeated a band of
    content and the whole form came out five phone-width pages. Links issued from
    here before 2026-08-06 are still in patients' inboxes, and were still
    producing that output when signed — so deleting the file outright would have
    broken them. Forwarding keeps them working and lands them on the fixed form.

    The query string is carried across unchanged: it holds the patient's name,
    date of birth, appointment details, MBS item and rebate, and the form is
    useless without them.
  -->
  <link rel="canonical" href="https://wisdomsurgery.team/forms/medicare-assignment.html">
  <script>
    (function () {
      var target = 'https://wisdomsurgery.team/forms/medicare-assignment.html';
      window.location.replace(target + window.location.search + window.location.hash);
    })();
  </script>
  <style>
    body { font-family: 'Source Sans 3', system-ui, sans-serif; background: #FDFAF5; color: #1E2B3A;
           display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 24px; }
    .box { max-width: 420px; text-align: center; }
    h1 { font-family: 'Playfair Display', Georgia, serif; font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 0.9rem; line-height: 1.55; color: #3D4F5E; margin: 0 0 14px; }
    a { color: #2BBFA4; font-weight: 600; }
  </style>
</head>
<body>
  <!-- Shown only if the redirect above cannot run. -->
  <div class="box">
    <h1>Taking you to your form…</h1>
    <p>The Medicare Assignment of Benefit form has moved.</p>
    <p><a id="manual" href="https://wisdomsurgery.team/forms/medicare-assignment.html">Open your form</a></p>
    <p style="font-size:0.8rem;color:#7A8A96;">If it does not open, call us on 1300 111 324.</p>
  </div>
  <script>
    // Keep the manual link working with the patient's own details attached.
    var a = document.getElementById('manual');
    a.href = a.href + window.location.search + window.location.hash;
  </script>
</body>
</html>
